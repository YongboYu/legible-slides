<!-- A blank for your affiliation's logo, so the cover renders the slot as a form rather than as a
     broken image. Replace it with your own mark: drop the file into this public/ and point the
     deck's headmatter at it. No institution's mark ships with this project.

     Greys rather than palette roles: an <img> cannot read the palette's custom properties, and a
     blank has no business tracking the palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="720" height="120"
     role="img" aria-label="Placeholder for your affiliation's logo">
  <rect x="1" y="1" width="718" height="118" rx="4" fill="#eeeeee" stroke="#b4b4b4"
        stroke-width="2" stroke-dasharray="10 8" />
  <text x="360" y="69" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="26" fill="#6e6e6e">affiliation logo</text>
</svg>
