name: method

on: [push, pull_request]

permissions:
  contents: read

# The half of a review that gates, run where nobody can skip it. What is checked here is exactly
# what docs/method.md marks decided by script; the rules it leaves to a reader are advisory and
# never block, which is why they are not a job. A green run says the gate holds, not that the deck is
# ready: that is the review's, read off the rendered pages.
#
# The checks run through bin/, which installs them from one commit of legible-slides, the same one
# the theme in theme/ was copied from. bin/legible holds that commit, and the hooks read the same
# file, so the gate and a local run cannot disagree about which rules apply. A later release is
# something you take on purpose, by changing it there and copying the theme again, not something a
# rerun picks up on its own.
#
# Blocking is the half a workflow cannot grant itself: make this a required status check in the
# branch ruleset, or a red run merges anyway.
jobs:
  method:
    name: the deck holds to the method
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The accessibility floor, over every palette this deck ships.
      - run: bin/cvd-validate themes/*.json

      # The stylesheet the deck imports, against the palette it is generated from. Committed like a
      # lockfile, so this is the only thing standing between a recoloured palette and a deck still
      # wearing the previous colours.
      - run: bin/legible gen-css themes/palette.json --output styles/tokens.css --check

      # The deck itself. A finding this calls an error turns the run red.
      - run: bin/legible lint slides.md --theme themes/palette.json


  # The deck renders from a clean checkout: the theme is vendored, so nothing outside this
  # repository is needed. What the pages look like is still the review's to read.
  build:
    name: the deck builds from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm run build
