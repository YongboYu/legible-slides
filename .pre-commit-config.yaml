# Opt-in, for fast local feedback on a palette edit. Install it with:
#
#     uv tool install pre-commit && pre-commit install
#
# The real gate is CI — .github/workflows/ci.yml runs the same check over every shipped theme on
# push and pull request, and a non-zero exit blocks merge. A hook any author can skip with
# `--no-verify` is convenience, never enforcement.
repos:
  - repo: local
    hooks:
      - id: cvd-validate
        name: data colours clear the separation floor
        # The package in this repo, so the hook and CI run the same code against the same pin.
        entry: uv run --project python cvd-validate
        language: system
        files: ^themes/.*\.json$
        # Only the staged theme files, so editing one palette does not re-check the others.
        pass_filenames: true

      # Regenerates rather than reports: the fix for a stale stylesheet is one command, so running
      # it is friendlier than naming it. pre-commit fails the commit when a hook writes, which
      # leaves the author staging the regenerated file — exactly what CI is about to check for.
      - id: gen-css
        name: the token stylesheet follows its palette
        # Only the deck's theme feeds the committed stylesheet, so the command names its own paths
        # rather than taking whichever palettes happen to be staged.
        entry: >
          uv run --project python
          legible gen-css themes/kuleuven.json --output theme/styles/tokens.css
        language: system
        files: ^themes/kuleuven\.json$
        pass_filenames: false

      # Same bargain as the stylesheet above, for the other committed artifact nobody runs anything
      # to get. The .pptx is a zip of hand-authored parts plus the fonts, the mark and the figure it
      # takes from elsewhere in the repo, so editing any of those without repacking ships a file
      # that no longer matches its own sources. Stdlib only, so it needs nothing installed.
      #
      # The directories are named rather than the individual files pack.py pulls out of them: which
      # figure or which weight the package carries is pack.py's to say, and a hook listing them
      # would be a second copy of that map to keep in step.
      - id: pack-pptx
        name: the PowerPoint proof follows its sources
        entry: python3 pptx/pack.py
        language: system
        files: ^(pptx/src/|theme/assets/fonts/|themes/logos/|deck/public/)
        pass_filenames: false
