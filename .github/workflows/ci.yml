name: CI

on: [push, pull_request]

permissions:
  contents: read

# Every job below is a required status check on `main` (#26), so a red run holds a merge open rather
# than merely reporting on one. Blocking is the one half a workflow file cannot grant itself; the
# branch ruleset grants it, and names each check by the `name:` on its job. Keep the two in step.
#
# That coupling fails closed, which is the direction worth having: rename a job here and the check
# the ruleset still expects never reports, so the merge waits rather than slipping through. The
# other direction is the quiet one — a job added here is advisory until it is added there.
#
# One deliberate hole. Repo admins are a bypass actor, because this repo is authored by direct push
# to `main` and required checks reject those outright. So the gate binds whatever arrives by pull
# request, and is discipline for the author — which is worth knowing before reading a green history
# as proof that every commit in it was ever gated.
jobs:
  # The gate. A theme whose data colours fall below the floor cannot merge — enforcement lives
  # here rather than in the opt-in pre-commit hook, which any author can skip.
  palette:
    name: palette floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The one theme this repo ships: a non-zero exit turns this check red. Grayscale collisions
      # are advisory and leave the exit code alone.
      - run: uv run --project python cvd-validate themes/leuven-blue.json

  # The other half of the palette's authority. theme/styles/tokens.css is generated from the deck's
  # theme and committed like a lockfile, which is what lets the deck build import it and never
  # invoke Python. Nothing enforces that but this: an author who edited the palette and forgot to
  # regenerate would otherwise ship a deck wearing the previous colours.
  tokens:
    name: token stylesheet is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: >
          uv run --project python
          legible gen-css themes/leuven-blue.json --output theme/styles/tokens.css --check

  # The flagship deck, built the way it is presented: a deck that names the theme by path, and
  # therefore the whole thin path from the palette to something that renders. It is held to the
  # method it teaches, so the linter runs over it here.
  #
  # The build also asserts two things that are easy to break and invisible in a screenshot: that no
  # font is fetched from a provider, and that the bundled ones shipped. A deck whose typeface arrives
  # over the network renders in a fallback in a lecture room with no wifi.
  deck:
    name: flagship deck builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: deck/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: The deck asks no font provider for anything
        run: '! grep -rq "fonts.googleapis.com\|fonts.gstatic.com\|api.fonts.coollabs.io" dist'
      - name: Both bundled families shipped with it
        run: ls dist/assets/Inter-*.woff2 dist/assets/JetBrainsMono-*.woff2
      # A deck is often hosted under a path, as GitHub Pages hosts a project's. Slidev leaves the
      # images a component binds to the theme, so the theme has to resolve them against the base.
      - name: Every image loads when the deck is hosted under a path
        run: |
          pnpm exec slidev build slides.md --base /talk/ --out "$RUNNER_TEMP/talk"
          pnpm exec playwright install --with-deps chromium
          node check-hosted-images.mjs "$RUNNER_TEMP/talk" /talk/
      # The claim that a palette edit reaches the deck with nothing edited in it. The value is read
      # from the theme file at check time rather than written here, so recolouring keeps this green
      # and cutting the deck off from the generated stylesheet turns it red.
      #
      # Read back from the built CSS rather than grepped for, because the minifier shortens a hex
      # where it can — #ffffff arrives as #fff — and a grep would call that a missing palette.
      - name: The palette reached the slides through the generated stylesheet
        run: |
          built=$(awk 'match($0, /--brand: *#[0-9a-fA-F]+/) {
                         hex = substr($0, RSTART, RLENGTH)
                         sub(/.*#/, "#", hex)
                         print tolower(hex)
                         exit
                       }' dist/assets/*.css)
          built=$(printf '%s' "$built" | sed -E 's/^#(.)(.)(.)$/#\1\1\2\2\3\3/')
          want=$(jq -r .brand ../themes/leuven-blue.json | tr 'A-Z' 'a-z')
          echo "deck: $built  palette: $want"
          test "$built" = "$want"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --project ../python legible lint slides.md --theme ../themes/leuven-blue.json

  # What the skill's scaffold mode stamps, stamped and built. The Python suite lints the template
  # and holds it to the theme's layouts and to its own palette; what it cannot reach is whether the
  # result renders, and whether the palette that reaches it is the deck's own.
  #
  # That second half is the one worth a runner. The stamped deck carries its own generated tokens,
  # and the theme package carries the project's palette, so a theme wearing another palette is
  # exactly what the deck has to outrank. A deck that wore the theme's palette by mistake would look
  # fine everywhere except in the built CSS.
  #
  # The stamped deck pins a theme on npm and checks on PyPI at this commit's version, which may not
  # be published yet. So the job builds both from this checkout and points the deck at them: a pnpm
  # override for the theme, and LEGIBLE_FROM for the checks. The pins themselves are held to the
  # release's version by python/tests/test_release.py. The deck itself is stamped by the create
  # package, packed from this checkout too, so the one command an author runs is the one tried here.
  scaffold:
    name: the scaffold's template builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The three packages a release would publish, built the way the release workflow builds them:
      # the wheel from the sdist, and the theme and the create package packed into a directory made
      # first, since npm pack fails on a destination that does not exist and a fresh runner has
      # none. Packing the create package bundles the starter into it.
      - name: Pack the theme and the create package, and build the checks
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack ./theme ./create --pack-destination "$RUNNER_TEMP/npm"
          uv build python --out-dir "$RUNNER_TEMP/python"
          echo "THEME_TARBALL=$(ls "$RUNNER_TEMP"/npm/slidev-theme-legible-*.tgz)" >> "$GITHUB_ENV"
          echo "CREATE_TARBALL=$(ls "$RUNNER_TEMP"/npm/create-legible-slides-*.tgz)" >> "$GITHUB_ENV"
          echo "LEGIBLE_FROM=$(ls "$RUNNER_TEMP"/python/legible_slides-*.whl)" >> "$GITHUB_ENV"
      # Stamped the way an author stamps one, `npm create legible-slides`, with the packed package
      # in place of the published one. npm runs it from its own cache, where no checkout sits
      # beside it, so the deck can only come from the starter bundled into the tarball. Stamped
      # outside the checkout too, so nothing here can accidentally satisfy what follows.
      - name: Stamp it with the create package
        working-directory: ${{ runner.temp }}
        run: npm exec --yes --package "$CREATE_TARBALL" -- create-legible-slides stamped
      # npm leaves a .gitignore out of a package, and the checks below run the launchers with no
      # chmod, so the two things a package can lose on its way are checked before anything else.
      - name: The deck arrived whole, named for its directory
        working-directory: ${{ runner.temp }}/stamped
        run: |
          test -f .gitignore
          test -x bin/legible
          test -x bin/cvd-validate
          test "$(jq -r .name package.json)" = stamped
      # The one edit, and it leaves the pin in place: pnpm still reads the pinned version and
      # resolves it to the tarball.
      - name: Point the theme at the packed tarball
        working-directory: ${{ runner.temp }}/stamped
        run: |
          jq --arg tarball "file:$THEME_TARBALL" \
            '.pnpm.overrides["slidev-theme-legible"] = $tarball' package.json > package.tmp
          mv package.tmp package.json
          grep -q '^theme: legible$' slides.md
      # The template arrives holding the theme's own palette, so a deck that wore the checkout's
      # colours instead would pass the check below by coincidence. Recolour it first, the way the
      # skill's step 4 does, so the two differ and the check can tell them apart. Any hex other than
      # the theme's own would do; the guard at the end of the step fails if the two ever coincide.
      - name: Recolour it
        working-directory: ${{ runner.temp }}/stamped
        run: |
          jq '.brand = "#1f4e79"' themes/palette.json > palette.tmp && mv palette.tmp themes/palette.json
          bin/legible gen-css themes/palette.json --output styles/tokens.css
          test "$(jq -r .brand themes/palette.json)" != "$(jq -r .brand "$GITHUB_WORKSPACE/themes/leuven-blue.json")"
      # The stamped deck's own checks, run the way its workflow and hooks run them: through bin/,
      # with no legible installed on this runner. A launcher that fell back to PATH would fail here
      # instead of passing on a copy nobody pinned. The guard at the top proves that copy is absent.
      - name: The stamped checks run through the launcher
        working-directory: ${{ runner.temp }}/stamped
        run: |
          if command -v legible || command -v cvd-validate; then
            echo "a legible install is on PATH, so this would not prove the launcher" >&2
            exit 1
          fi
          bin/cvd-validate themes/palette.json
          bin/legible gen-css themes/palette.json --output styles/tokens.css --check
          bin/legible lint slides.md --theme themes/palette.json
      # No lockfile is stamped: a deck resolves its own, and pinning one here would pin every deck
      # scaffolded from it to whatever this repo last resolved. The check after it asks pnpm where
      # the theme came from, so a theme fetched from npm in place of the tarball turns this red.
      - run: pnpm install
        working-directory: ${{ runner.temp }}/stamped
      - name: The theme came from the packed tarball
        working-directory: ${{ runner.temp }}/stamped
        run: |
          resolved=$(pnpm list --json slidev-theme-legible \
            | jq -r '.[0].dependencies["slidev-theme-legible"].resolved')
          echo "resolved: $resolved  packed: $THEME_TARBALL"
          test "$(basename "$resolved")" = "$(basename "$THEME_TARBALL")"
      - run: pnpm run build
        working-directory: ${{ runner.temp }}/stamped
      # The starter has one slide per layout the theme ships, so this build is also the theme's.
      - name: The deck asks no font provider for anything
        working-directory: ${{ runner.temp }}/stamped
        run: '! grep -rq "fonts.googleapis.com\|fonts.gstatic.com\|api.fonts.coollabs.io" dist'
      - name: Both bundled families shipped with it
        working-directory: ${{ runner.temp }}/stamped
        run: ls dist/assets/Inter-*.woff2 dist/assets/JetBrainsMono-*.woff2
      - name: The deck wears its own palette, not the theme package's
        working-directory: ${{ runner.temp }}/stamped
        run: |
          built=$(awk 'match($0, /--brand: *#[0-9a-fA-F]+/) {
                         hex = substr($0, RSTART, RLENGTH)
                         sub(/.*#/, "#", hex)
                         print tolower(hex)
                         exit
                       }' dist/assets/*.css)
          built=$(printf '%s' "$built" | sed -E 's/^#(.)(.)(.)$/#\1\1\2\2\3\3/')
          want=$(jq -r .brand themes/palette.json | tr 'A-Z' 'a-z')
          echo "stamped: $built  palette: $want"
          test "$built" = "$want"

  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Asserts the shipped palette's achieved minima, so a colorspacious bump that shifted the
      # simulation or the distance surfaces here rather than in a theme someone already trusts.
      - run: uv run pytest

  # An external theme author is offered the CLI and gated by nothing, so the package has to work
  # with no checkout to read: installed from a built wheel, against a palette living elsewhere.
  package:
    name: package installs standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Builds the sdist, then the wheel from that sdist — the path where a canon the build forgot
      # to carry would go missing.
      - run: uv build python --out-dir "$RUNNER_TEMP/dist"
      # Named for PyPI, as python/pyproject.toml explains. The install below globs the wheel and
      # would take any name, so the name gets its own check.
      - name: Both artifacts are named legible-slides
        run: ls "$RUNNER_TEMP"/dist/legible_slides-*.whl "$RUNNER_TEMP"/dist/legible_slides-*.tar.gz
      - name: Check a palette outside this repo
        run: |
          mkdir -p "$RUNNER_TEMP/outside"
          cp themes/leuven-blue.json "$RUNNER_TEMP/outside/my-palette.json"
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP/outside"
          "$RUNNER_TEMP/venv/bin/cvd-validate" my-palette.json
      # The linter shells out to cvd-validate rather than importing it, so it has to find that
      # command with nothing activated — the arrangement an installed tool actually runs in, and
      # the one thing the test suite cannot prove from inside its own virtualenv.
      - name: Lint a deck outside this repo
        run: |
          cd "$RUNNER_TEMP/outside"
          printf '# A deck can be linted with no checkout to read\n\n- one point\n' > slides.md
          "$RUNNER_TEMP/venv/bin/legible" lint slides.md --theme my-palette.json
      # The review skill carries no rule of its own and loads them here, so a wheel that reached a
      # stranger's machine without the canon would leave it reviewing against nothing. The linter
      # above only quotes numbers out of that file; this reads whole rules out of it.
      - name: Quote the canon outside this repo
        run: |
          cd "$RUNNER_TEMP/outside"
          "$RUNNER_TEMP/venv/bin/legible" rules --section voice --decided-by judgment
      # The canon is not the only thing the build has to carry: a figure drawn without the bundled
      # typeface would not match the deck, and `legible.fonts` raises rather than substituting one.
      # A runner has no Inter installed, so this fails loudly if the wheel forgot the fonts.
      - name: Draw a figure outside this repo
        run: |
          cd "$RUNNER_TEMP/outside"
          "$RUNNER_TEMP/venv/bin/python" -c "
          from legible import load_palette
          from legible.figures import Series, multi_series, save
          palette = load_palette('my-palette.json')
          save(multi_series(palette, [Series('a', [1, 2, 3]), Series('b', [3, 2, 1])]), 'chart.png')
          "
