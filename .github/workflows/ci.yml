name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # The gate. A theme whose data colours fall below the floor cannot merge — enforcement lives
  # here rather than in the opt-in pre-commit hook, which any author can skip.
  #
  # Blocking is the half a workflow cannot grant itself: this job has to be a required status
  # check in the branch ruleset, or a red run merges anyway.
  palette:
    name: palette floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Every theme this repo ships, in one invocation: a non-zero exit from any of them turns
      # this check red. Grayscale collisions are advisory and leave the exit code alone.
      - run: uv run --project python cvd-validate themes/*.json

  # The other half of the palette's authority. theme/styles/tokens.css is generated from the deck's
  # theme and committed like a lockfile, which is what lets the deck build import it and never
  # invoke Python. Nothing enforces that but this: an author who edited the palette and forgot to
  # regenerate would otherwise ship a deck wearing the previous colours.
  #
  # Like the floor above, it only blocks if the branch ruleset makes it a required check.
  tokens:
    name: token stylesheet is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: >
          uv run --project python
          legible gen-css themes/kuleuven.json --output theme/styles/tokens.css --check

  # The theme's own build, over the example deck that exercises every layout it ships. A theme is
  # declarative — layouts, chrome and one stylesheet — so a build that renders every layout is the
  # test worth having, and there is no JavaScript unit suite behind it.
  #
  # It also asserts the two things about the built output that are easy to break and invisible in a
  # screenshot: that no font is fetched from a provider, and that the bundled ones actually shipped.
  # A deck whose typeface arrives over the network is a deck that renders in a fallback in a
  # lecture room with no wifi, and nothing else in this pipeline would notice.
  theme:
    name: theme example builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theme
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: theme/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: The deck asks no font provider for anything
        run: '! grep -rq "fonts.googleapis.com\|fonts.gstatic.com\|api.fonts.coollabs.io" dist'
      - name: Both bundled families shipped with it
        run: ls dist/assets/Inter-*.woff2 dist/assets/JetBrainsMono-*.woff2
      # The example is shipped as an exemplar, so it is held to the method like any other deck. The
      # linter runs beside the build rather than inside it: what must never depend on Python is the
      # build, and this is a separate command.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --project ../python legible lint example.md

  # The flagship deck, built the way it is presented. The theme job above proves the machinery on
  # its own example; this one is the only place the two halves meet — a deck that names the theme by
  # path, and therefore the whole thin path from the palette to something that renders.
  #
  # It is held to the method it teaches, so the linter runs over it here rather than over the
  # example alone. A flagship that breaks its own rules is worse than no flagship.
  deck:
    name: flagship deck builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: deck/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: The deck asks no font provider for anything
        run: '! grep -rq "fonts.googleapis.com\|fonts.gstatic.com\|api.fonts.coollabs.io" dist'
      - name: Both bundled families shipped with it
        run: ls dist/assets/Inter-*.woff2 dist/assets/JetBrainsMono-*.woff2
      # The claim that a palette edit reaches the deck with nothing edited in it. The value is read
      # from the theme file at check time rather than written here, so recolouring keeps this green
      # and cutting the deck off from the generated stylesheet turns it red.
      #
      # Read back from the built CSS rather than grepped for, because the minifier shortens a hex
      # where it can — #ffffff arrives as #fff — and a grep would call that a missing palette.
      - name: The palette reached the slides through the generated stylesheet
        run: |
          built=$(awk 'match($0, /--brand: *#[0-9a-fA-F]+/) {
                         hex = substr($0, RSTART, RLENGTH)
                         sub(/.*#/, "#", hex)
                         print tolower(hex)
                         exit
                       }' dist/assets/*.css)
          built=$(printf '%s' "$built" | sed -E 's/^#(.)(.)(.)$/#\1\1\2\2\3\3/')
          want=$(jq -r .brand ../themes/kuleuven.json | tr 'A-Z' 'a-z')
          echo "deck: $built  palette: $want"
          test "$built" = "$want"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --project ../python legible lint slides.md --theme ../themes/kuleuven.json

  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Asserts the shipped palettes' achieved minima, so a colorspacious bump that shifted the
      # simulation or the distance surfaces here rather than in a theme someone already trusts.
      - run: uv run pytest

  # An external theme author is offered the CLI and gated by nothing, so the package has to work
  # with no checkout to read: installed from a built wheel, against a palette living elsewhere.
  package:
    name: package installs standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Builds the sdist, then the wheel from that sdist — the path where a canon the build forgot
      # to carry would go missing.
      - run: uv build python --out-dir "$RUNNER_TEMP/dist"
      - name: Check a palette outside this repo
        run: |
          mkdir -p "$RUNNER_TEMP/outside"
          cp themes/neutral.json "$RUNNER_TEMP/outside/my-palette.json"
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP/outside"
          "$RUNNER_TEMP/venv/bin/cvd-validate" my-palette.json
      # The linter shells out to cvd-validate rather than importing it, so it has to find that
      # command with nothing activated — the arrangement an installed tool actually runs in, and
      # the one thing the test suite cannot prove from inside its own virtualenv.
      - name: Lint a deck outside this repo
        run: |
          cd "$RUNNER_TEMP/outside"
          printf '# A deck can be linted with no checkout to read\n\n- one point\n' > slides.md
          "$RUNNER_TEMP/venv/bin/legible" lint slides.md --theme my-palette.json
      # The canon is not the only thing the build has to carry: a figure drawn without the bundled
      # typeface would not match the deck, and `legible.fonts` raises rather than substituting one.
      # A runner has no Inter installed, so this fails loudly if the wheel forgot the fonts.
      - name: Draw a figure outside this repo
        run: |
          cd "$RUNNER_TEMP/outside"
          "$RUNNER_TEMP/venv/bin/python" -c "
          from legible import load_palette
          from legible.figures import Series, multi_series, save
          palette = load_palette('my-palette.json')
          save(multi_series(palette, [Series('a', [1, 2, 3]), Series('b', [3, 2, 1])]), 'chart.png')
          "
