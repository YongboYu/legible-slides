[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `legible` is taken on PyPI. Only the name a user installs differs: the import is still `legible`,
# and the commands below keep theirs.
name = "legible-slides"
version = "0.1.0"
description = "The mechanical half of legible-slides: palette loading and CVD validation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # Pinned, not floated. The achieved minima published in
    # docs/cvd-validator-contract.md §3 are this library's output; a version
    # that shifted the simulation or the distance would move every one of them.
    # Bumping this pin means re-running the theme tests and updating those
    # tables. colorspacious' last release is 2018, so the pin costs nothing.
    "colorspacious==1.1.2",
    # Floated within a major, unlike colorspacious above. A ΔE is a published
    # measurement and must not move; a figure is a regenerated artifact, and a
    # matplotlib bump that shifts a few pixels shows up as a reviewable diff in
    # the committed PNGs rather than as a claim quietly going false. 3.8 is the
    # floor because the archetypes build a bare `Figure` and save it without
    # pyplot, which needs no backend and leaks no global state.
    "matplotlib>=3.8,<4",
    # The headline wrap reads the bundled face's advances and kerning. matplotlib already pulls
    # fontTools in, so this names a dependency rather than adding one.
    "fonttools>=4.22",
]

[project.urls]
Repository = "https://github.com/YongboYu/legible-slides"
# The method is what the checks enforce, and the one place their rules and numbers are written.
Documentation = "https://github.com/YongboYu/legible-slides/blob/main/docs/method.md"
Issues = "https://github.com/YongboYu/legible-slides/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
# Its own entry point, because this is the artifact external theme authors are pointed at.
cvd-validate = "legible.cli:main"
# Everything that acts on a deck rather than on a stranger's palette: `gen-css` today, the figure
# commands and `lint` as they land.
legible = "legible.command:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legible"]

# Copies docs/method.md into the built package so an install outside this repo still reads its
# thresholds from the canon. See hatch_build.py.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Matches the 100-column prose the docs are written to.
line-length = 100
target-version = "py310"
# Prose, and the aligned comments in its examples, are the repo's to format — not ruff's.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
